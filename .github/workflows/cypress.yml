name: Run Cypress Tests on JS Changes

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    env:
      TIMESTAMP: ${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: |
          npm install
          npm install mochawesome@7.1.3 mochawesome-merge@4.3.0 mochawesome-report-generator@6.2.4 --save-dev
      - name: Run Cypress tests and generate mochawesome report
        run: |
          mkdir -p mochawesome-results
          npx cypress run --reporter mochawesome --reporter-options "reportDir=mochawesome-results,overwrite=false,html=false,json=true,reportFilename=mochawesome-$TIMESTAMP"
          npx mochawesome-merge mochawesome-results/*.json > mochawesome-results/merged-$TIMESTAMP.json
      - name: Print merged JSON file contents
        run: |
          cat mochawesome-results/merged-$TIMESTAMP.json || echo "Merged JSON not found"
      - name: Generate mochawesome HTML report
        run: |
          npx marge mochawesome-results/mochawesome-$TIMESTAMP.json --reportDir mochawesome-results --reportFilename awesome-report-$TIMESTAMP.html --overwrite --reportTitle "CTTexpress Test Report"
      - name: Upload mochawesome HTML report
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html-report
          path: mochawesome-results/*.html
