name: Run Cypress Tests on JS Changes

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.yml'
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    env:
      TIMESTAMP: ${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: |
          npm install
          npm install cypress-junit --save-dev
      - name: Run Cypress tests and generate mochawesome report
        run: |
          mkdir -p junit-results
          npx cypress run --reporter junit --reporter-options "mochaFile=junit-results/results-$TIMESTAMP.xml,toConsole=true"
      - name: Print merged JSON file contents
        run: |
          cat junit-results/results-$TIMESTAMP.xml || echo "JUnit XML not found"
      - name: Generate mochawesome HTML report
        run: |
          echo "JUnit report generated. Skipping HTML generation."
      - name: Upload mochawesome HTML report
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-report
          path: junit-results/*.xml
