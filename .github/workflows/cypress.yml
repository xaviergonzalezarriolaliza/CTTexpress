## Trigger workflow run
name: Run Cypress Tests on JS Changes

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: npm install
      - name: Run Cypress tests and save report
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          mkdir -p results
          npx cypress run --reporter junit --reporter-options "mochaFile=results/test_report_$TIMESTAMP.xml"
      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-report
          path: results/
