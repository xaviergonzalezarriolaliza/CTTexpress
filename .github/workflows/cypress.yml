name: Run Cypress Tests on JS Changes

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.yml'
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    env:
      TIMESTAMP: ${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: |
          npm install
          npm install cypress-mochawesome-reporter --save-dev
      - name: Run Cypress tests and generate mochawesome report
        run: |
          mkdir -p mochawesome-report
          npx cypress run --reporter cypress-mochawesome-reporter --reporter-options "reportDir=mochawesome-report,reportFilename=mochawesome.html,overwrite=true,html=true,json=true"
      - name: Print merged JSON file contents
        run: |
          cat mochawesome-report/mochawesome.html || echo "HTML report not found"
      - name: Generate mochawesome HTML report
        run: |
          echo "Mochawesome HTML report generated. Skipping additional generation."
      - name: Upload mochawesome HTML report
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html-report
          path: mochawesome-report/*.html
