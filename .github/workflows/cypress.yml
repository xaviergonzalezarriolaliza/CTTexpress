name: Run Cypress Tests on JS Changes

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: |
          npm install
          npm install mochawesome mochawesome-merge mochawesome-report-generator --save-dev
      - name: Run Cypress tests and generate mochawesome report
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          mkdir -p mochawesome-results
          npx cypress run --reporter mochawesome --reporter-options "reportDir=mochawesome-results,overwrite=false,html=false,json=true,reportFilename=mochawesome-$TIMESTAMP"
          npx mochawesome-merge mochawesome-results/*.json > mochawesome-results/merged-$TIMESTAMP.json
          npx marge mochawesome-results/merged-$TIMESTAMP.json --reportDir mochawesome-results --reportFilename awesome-report-$TIMESTAMP.html
      - name: Upload mochawesome HTML report
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html-report
          path: mochawesome-results/*.html
